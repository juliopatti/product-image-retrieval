[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "product-image-retrieval"
version = "0.1.0"
description = "Image retrieval pipeline for product catalog enrichment"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]


[tool.setuptools.packages.find]
where = ["src"]